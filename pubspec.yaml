name: bbk_flutter
description: "步步高经典游戏2：纯 Flutter 伏魔记与三国霸业。"
publish_to: none
version: 1.0.13+14
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
dependency_overrides:
  path_provider_android: 2.2.23
  vm_service: 15.3.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: BBK CJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
          weight: 400
  assets:
    - assets/images/
    - assets/branding/
    - assets/fmj/game/
    - assets/fmj/modern/
    - assets/fmj/branding/
    - assets/sgby/game/
    - assets/sgby/art/
    - licenses/fmj/
    - licenses/sgby/
    - licenses/fonts/
