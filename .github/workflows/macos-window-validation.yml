name: macOS 窗口代码校验
on:
  push:
    branches: [main]
    paths:
      - macos/Runner/**
      - lib/ui/core/desktop_window_service.dart
      - .github/workflows/macos-window-validation.yml
  pull_request:
    paths:
      - macos/Runner/**
      - lib/ui/core/desktop_window_service.dart
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: flutter pub get --enforce-lockfile
      # 只校验窗口原生代码；不改版本，不制作DMG/ZIP，不上传应用，不发布Release。
      - run: flutter build macos --debug
