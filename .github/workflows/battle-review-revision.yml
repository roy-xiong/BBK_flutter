name: 定向修订战斗动效复审
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  patch:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m pip install Pillow
      - run: python3 tool/export_fmj_battle_catalog.py
      - run: python3 tool/export_fmj_battle_review_scope.py --output build/battle-review/review-scope.json
      - name: 仅重录本轮剑体造型与轨迹的23个关联案例
        env:
          FMJ_EXPORT_BATTLE_REVIEW: '1'
          FMJ_REVIEW_FORMAT: webp
          FMJ_REVIEW_PATCH: '1'
          FMJ_REVIEW_SHARD: ${{ matrix.shard }}
          FMJ_REVIEW_SHARDS: '4'
        run: flutter test --no-pub test/games/fmj/battle_review_export_test.dart --reporter expanded
      - uses: actions/upload-artifact@v4
        with:
          name: battle-patch-${{ matrix.shard }}
          path: |
            build/battle-review/*.webp
            build/battle-review/*.gif
            build/battle-review/patch-shard-*.json
          retention-days: 30
  document:
    needs: patch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 已通过案例复用上轮彩色原文件
        uses: actions/download-artifact@v4
        with:
          pattern: battle-gifs-*
          run-id: '41074672827'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/battle-review
      - name: 逐案例记录原文件摘要
        run: python3 tool/merge_fmj_review_patch.py --record-base
      - name: 恢复上一轮已经修订的48个原文件
        uses: actions/download-artifact@v4
        with:
          pattern: battle-patch-*
          run-id: '41089701112'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/battle-review
      - name: 重建V3基线并保持上一轮真实来源
        run: |
          python3 tool/merge_fmj_review_patch.py --feedback tool/fmj_battle_review_feedback_round2.json --render-revision 97d5ad7fd465a59bcdcf1d096427cfa16361f215 --report base-v3-verification.json
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('build/battle-review').glob('patch-shard-*.json'):path.unlink()
          PY
          python3 tool/merge_fmj_review_patch.py --record-base
          python3 tool/export_fmj_battle_catalog.py
          python3 tool/export_fmj_battle_review_scope.py --output build/battle-review/review-scope.json
      - uses: actions/download-artifact@v4
        with:
          pattern: battle-patch-*
          merge-multiple: true
          path: build/battle-review
      - name: 仅合并授权的23个案例并校验其他689个文件不变
        run: python3 tool/merge_fmj_review_patch.py --scope build/battle-review/review-scope.json
      - name: 复用原版黑白对照
        uses: actions/download-artifact@v4
        with:
          pattern: battle-classic-*
          run-id: '41030865029'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/battle-review
      - run: python3 -m pip install Pillow
      - run: python3 tool/export_fmj_battle_catalog.py
      - run: python3 tool/build_fmj_battle_review.py --require-classic --classic-render-revision a9b568a31683dbbd0f19a63a1cb20d29838dabd8
      - uses: actions/upload-artifact@v4
        with:
          name: fmj-battle-review-round4-document
          path: |
            build/battle-review/*.html
            build/battle-review/*.manifest.json
            build/battle-review/patch-verification.json
          retention-days: 30
