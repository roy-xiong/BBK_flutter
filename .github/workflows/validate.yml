name: BBK Flutter 校验
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: python3 tool/verify_source_snapshot.py
      - run: python3 tool/verify_game_font.py
      - name: 原有两款游戏及合集入口回归
        env:
          FMJ_EXPORT_APPROVED_ART: '1'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/validation
          flutter test --no-pub --reporter expanded 2>&1 | tee build/validation/tests.log
      - name: 全地图交互审核网页
        run: |
          python3 -m pip install Pillow
          python3 tool/build_fmj_review.py
          python3 tool/build_fmj_review.py --patch --output build/validation/partial-review/maps.json
      - name: 连续回放摘要
        if: always()
        run: python3 tool/write_validation_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbk-validation
          path: build/validation/
          if-no-files-found: ignore
          retention-days: 14
      - name: 本轮场景与菜单小体积预览
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmj-current-review
          path: |
            build/validation/current-scene-audit/*360.png
            build/validation/current-scene-audit/sanqing-gate.png
            build/validation/current-scene-audit/lifu-hall.png
            build/validation/current-scene-audit/lifu-lions.png
            build/validation/current-scene-audit/lifu-bucket-well.png
            build/validation/current-scene-audit/jianye-north-shops.png
            build/validation/approved-art/map-2-20.png
            build/validation/macos-v22/
            build/validation/current-feedback-v32/
          if-no-files-found: ignore
          retention-days: 14
      - name: 全地图交互审核文档
        uses: actions/upload-artifact@v4
        with:
          name: fmj-map-review
          path: build/validation/review/
          if-no-files-found: error
          retention-days: 14
      - name: 本轮已批注地图修订画面
        uses: actions/upload-artifact@v4
        with:
          name: fmj-partial-review
          path: |
            build/validation/partial-review/
            build/validation/art-sweep-v15/
          if-no-files-found: error
          retention-days: 14
